schema_version: "1.0"
trial_id: det_ft_official_aug
kind: detector
base_config: configs/det/PP-OCRv6/PP-OCRv6_medium_det.yml
source_checkpoint: D:/OCR_Model_Assets/models/paddleocr/training/PP-OCRv6_medium_det_pretrained.pdparams
metadata:
  purpose: Official PP-OCRv6 document augmentation recipe with a bounded low learning rate.
  selection_split: dev_select
  epochs: 2
  expected_iterations_per_epoch: 1912
  early_stopping: Select the best checkpoint written from DEV_SELECT hmean; do not inspect TEST.
  train_data: public TRAIN only
overrides:
  Global:
    epoch_num: 2
    print_batch_step: 20
    save_epoch_step: 1
    eval_batch_step: [0, 1912]
    cal_metric_during_train: false
    use_visualdl: false
  Optimizer:
    lr:
      name: Cosine
      learning_rate: 0.0001
      warmup_epoch: 0
  Train:
    dataset:
      data_dir: D:/OCR_Model_Assets/data/detector_training
      label_file_list:
        - D:/OCR_Model_Assets/data/detector_training/train_labels.txt
      ratio_list: [1.0]
    loader:
      shuffle: true
      drop_last: false
      batch_size_per_card: 4
      num_workers: 4
  Eval:
    dataset:
      data_dir: D:/OCR_Model_Assets/data/detector_training
      label_file_list:
        - D:/OCR_Model_Assets/data/detector_training/validation_labels.txt
    loader:
      shuffle: false
      drop_last: false
      batch_size_per_card: 1
      num_workers: 2

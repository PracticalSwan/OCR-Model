schema_version: "1.0"
trial_id: det_ft_small_text
kind: detector
base_config: configs/det/PP-OCRv6/PP-OCRv6_medium_det.yml
source_checkpoint: D:/CSX4201/vision-info-extraction-assets/models/paddleocr/training/PP-OCRv6_medium_det_pretrained.pdparams
metadata:
  purpose: Preserve document orientation while increasing scale and small-text supervision.
  selection_split: dev_select
  epochs: 2
  expected_iterations_per_epoch: 3823
  early_stopping: Select the best checkpoint written from DEV_SELECT hmean; do not inspect TEST.
  train_data: public TRAIN only
overrides:
  Global:
    epoch_num: 2
    print_batch_step: 20
    save_epoch_step: 1
    eval_batch_step: [0, 3823]
    cal_metric_during_train: false
    d2s_train_image_shape: [3, 960, 960]
    use_visualdl: false
  Optimizer:
    lr:
      name: Cosine
      learning_rate: 0.00005
      warmup_epoch: 0
  PostProcess:
    name: DBPostProcess
    thresh: 0.2
    box_thresh: 0.4
    max_candidates: 3000
    unclip_ratio: 1.5
  Train:
    dataset:
      data_dir: D:/CSX4201/vision-info-extraction-assets/data/detector_training
      label_file_list:
        - D:/CSX4201/vision-info-extraction-assets/data/detector_training/train_labels.txt
      ratio_list: [1.0]
      transforms:
        - DecodeImage:
            img_mode: BGR
            channel_first: false
        - DetLabelEncode: null
        - CopyPaste: null
        - ColorJitter:
            brightness: 0.25
            contrast: 0.25
            saturation: 0.25
            hue: 0.05
        - IaaAugment:
            augmenter_args:
              - type: Affine
                args:
                  p: 0.35
                  rotate: [-15, 15]
                  fit_output: true
              - type: Resize
                args:
                  size: [0.5, 2.0]
        - RandomPerspective:
            prob: 0.15
            scale: 0.0
            shear: 8.0
            perspective: 0.0005
            fit_output: true
            fill_value: [255, 255, 255]
        - RandomCrop:
            size: [960, 960]
            max_tries: 50
            keep_ratio: true
        - MakeBorderMap:
            shrink_ratio: 0.4
            thresh_min: 0.3
            thresh_max: 0.7
            total_epoch: 2
        - MakeShrinkMap:
            shrink_ratio: 0.4
            min_text_size: 4
            total_epoch: 2
        - NormalizeImage:
            scale: 1./255.
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]
            order: hwc
        - ToCHWImage: null
        - KeepKeys:
            keep_keys: [image, threshold_map, threshold_mask, shrink_map, shrink_mask]
    loader:
      shuffle: true
      drop_last: false
      batch_size_per_card: 2
      num_workers: 4
  Eval:
    dataset:
      data_dir: D:/CSX4201/vision-info-extraction-assets/data/detector_training
      label_file_list:
        - D:/CSX4201/vision-info-extraction-assets/data/detector_training/validation_labels.txt
    loader:
      shuffle: false
      drop_last: false
      batch_size_per_card: 1
      num_workers: 2
